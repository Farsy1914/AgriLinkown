<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgriLink - Analyst Settings</title>
  <link rel="stylesheet" href="analyst-style.css">
</head>
<body>

  <!-- Sidebar Component -->
  <aside class="sidebar">
    <a href="analyst-dashboard.html" class="brand">📊 AgriLink Insights</a>
    <nav>
      <a href="analyst-dashboard.html">Overview & Analytics</a>
      <a href="project-audits.html">Project Feasibility Audits</a>
      <a href="crop-diagnostics.html">AI Disease Diagnostics</a>
      <a href="analyst-profile.html">My Profile</a>
      <a href="analyst-settings.html" class="active">Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header>
      <div>
        <h2>Analyst Portal Settings</h2>
        <p style="color: var(--text-muted);">Manage AI threshold controls, diagnostic alerts, and security settings.</p>
      </div>
      <a href="analyst-profile.html" class="avatar">AN</a>
    </header>

    <!-- Section 1: Security -->
    <section class="card">
      <h3 style="margin-bottom: 16px; color: var(--primary-dark);">Security & Authentication</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div>
          <label style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px;">Current Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="curr-pass" placeholder="••••••••" style="padding-right: 65px;">
            <button type="button" onclick="togglePassword('curr-pass', this)" style="position: absolute; right: 10px; background: none; border: none; color: var(--accent-color); font-weight: 600; cursor: pointer; width: auto;">Show</button>
          </div>
        </div>
        <div>
          <label style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px;">New Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="new-pass" placeholder="New Password" style="padding-right: 65px;">
            <button type="button" onclick="togglePassword('new-pass', this)" style="position: absolute; right: 10px; background: none; border: none; color: var(--accent-color); font-weight: 600; cursor: pointer; width: auto;">Show</button>
          </div>
        </div>
      </div>
      <button type="button" class="btn" style="width: auto; background-color: var(--text-muted);">Update Security Settings</button>
    </section>

    <!-- Section 2: AI Audit Automation Controls -->
    <section class="card">
      <h3 style="margin-bottom: 16px; color: var(--primary-dark);">AI Advisory & Escalation Controls</h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <label style="display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem; width: fit-content; cursor: pointer;">
          <input type="checkbox" checked style="width: auto;">
          <span>Automatically flag AI Disease Diagnostics with confidence below 70% for manual review.</span>
        </label>

        <label style="display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem; width: fit-content; cursor: pointer;">
          <input type="checkbox" checked style="width: auto;">
          <span>Receive instant SMS alerts when a crowdfunding request exceeds ৳5,00,000 for mandatory feasibility audit.</span>
        </label>

        <label style="display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem; width: fit-content; cursor: pointer;">
          <input type="checkbox" style="width: auto;">
          <span>Enable weekly automated regional market price fluctuation reports.</span>
        </label>
      </div>
    </section>

    <button type="button" class="btn btn-success" onclick="alert('Analyst Settings Saved!')" style="padding: 12px 32px; width: auto;">Save Preferences</button>
  </main>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
      } else {
        input.type = "password";
        btn.textContent = "Show";
      }
    }
  </script>

</body>
</html>
